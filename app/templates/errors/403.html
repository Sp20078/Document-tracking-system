{% extends "base.html" %}
{% block title %}403 — Forbidden{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 fw-bold text-danger">403</h1>
  <p class="lead">Access denied.</p>
  <p class="text-muted">{{ message or 'Your role does not permit this action.' }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.user_id else url_for('auth.login') }}">
    <i class="bi bi-house me-1"></i>Back to home</a>
</div>
{% endblock %}
