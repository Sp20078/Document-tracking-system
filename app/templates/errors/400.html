{% extends "base.html" %}
{% block title %}400 — Bad request{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 fw-bold text-warning">400</h1>
  <p class="lead">The request could not be processed.</p>
  <p class="text-muted">{{ message or 'The form token may have expired — go back and try again.' }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.user_id else url_for('auth.login') }}">
    <i class="bi bi-house me-1"></i>Back to home</a>
</div>
{% endblock %}
